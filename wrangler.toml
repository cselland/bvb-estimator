name = "build-vs-buy-estimator"
main = ".open-next/worker.js"
compatibility_date = "2026-05-06"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
SUMMARY_PROVIDER = "gemini"
OPENAI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
OPENAI_MODEL = "gemini-2.5-flash"
RESEND_FROM = "Chris <chris@differentialfactor.ai>"

# Required so `/_next/static/*` (JS/CSS) is served; without this, HTML loads but hydration never runs.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "build-vs-buy-estimator"

# Nightly model-price snapshot from the Overshoot Index (same Cloudflare
# account). RPC to its PriceSnapshots entrypoint -- there is deliberately no
# public HTTP endpoint for this data (OpenRouter's terms). `remote = true`
# only affects `wrangler dev`: local runs read the production snapshot
# (2 D1 rows per cache miss) instead of needing Overshoot running locally.
[[services]]
binding = "OVERSHOOT"
service = "overshoot-index"
entrypoint = "PriceSnapshots"
remote = true

[[d1_databases]]
binding = "DB"
database_name = "build-vs-buy-db"
database_id = "56ba949d-e804-4224-b4dd-c9dceb6d7030"

[[routes]]
pattern = "bvb.differentialfactor.com"
custom_domain = true
